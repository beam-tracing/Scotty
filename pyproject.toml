[build-system]
requires = [
    "setuptools >= 61.0.0",
    "setuptools_scm[toml] >= 7",
    "wheel >= 0.29.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "scotty-beam-tracing"
description = "Beam tracing for tokamak DBS diagnostics"
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "Valerian Hall-Chen"}]
urls = {project = "https://github.com/beam-tracing/Scotty"}
dependencies = [
    "numpy>=2.0",
    # NumPy 2 needs these versions or newer
    "scipy>=1.13",
    "matplotlib>=3.8",
    "xarray>=2024.10.0",
    "h5netcdf[h5py]",  # recent h5netcdf makes h5py (the backend Scotty uses) an optional extra
]
dynamic = ["version"]

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-timeout",
    "pytest-xdist",
]
docs = [
    "sphinx >= 5.3",
    "sphinx-book-theme >= 1.1.0",
]

[tool.setuptools]
packages = ["scotty"]

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools_scm]
write_to = "scotty/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::UserWarning:h5netcdf",
]

[tool.mypy]
plugins = "numpy.typing.mypy_plugin"
ignore_missing_imports = "True"

[tool.ruff]
line-length = 88
ignore = ["E501"]
